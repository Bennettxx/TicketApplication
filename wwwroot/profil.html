<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Mein Profil</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .karte { max-width: 520px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar"></div>

    <div class="main">
        <span class="benutzer" id="benutzername">...</span>
        <h1>Mein Profil</h1>

        <div class="karte">
            <h3 style="margin-top:0">Stammdaten</h3>
            <label>Vorname</label>
            <input type="text" id="vorname">
            <label>Nachname</label>
            <input type="text" id="nachname">
            <label>E-Mail (nicht änderbar)</label>
            <input type="email" id="email" readonly style="background:#eee; cursor:not-allowed">
            <div id="abteilungBox" style="display:none;">
                <label>Abteilung</label>
                <select id="abteilung"></select>
            </div>
            <button class="btn-gruen" style="margin-top:14px;" onclick="profilSpeichern()">Speichern</button>
            <span id="profilFeedback" class="mini"></span>
        </div>

        <div class="karte">
            <h3 style="margin-top:0">Passwort ändern</h3>
            <label>Aktuelles Passwort</label>
            <input type="password" id="altPw">
            <label>Neues Passwort</label>
            <input type="password" id="neuPw">
            <label>Neues Passwort wiederholen</label>
            <input type="password" id="neuPw2">
            <p class="mini">Min. 8 Zeichen, Groß-/Kleinbuchstabe und Ziffer.</p>
            <button class="btn-gruen" onclick="passwortAendern()">Passwort ändern</button>
            <span id="pwFeedback" class="mini"></span>
        </div>
    </div>

    <script src="/app.js"></script>
    <script>
        (async function () {
            await seitenleisteAufbauen('profil');
            const mich = await getMich();
            document.getElementById('vorname').value = mich.firstName || '';
            document.getElementById('nachname').value = mich.secondName || '';
            document.getElementById('email').value = mich.email || '';

            // Abteilung nur für Rolle User anzeigen/änderbar (Admin/Support haben keine).
            if (mich.role === 'User') {
                document.getElementById('abteilungBox').style.display = 'block';
                try {
                    const abt = await api('/api/metadata/departments');
                    const sel = document.getElementById('abteilung');
                    abt.forEach(a => {
                        const o = document.createElement('option');
                        o.value = a.name; o.textContent = a.name;
                        if (a.name === mich.departmentName) o.selected = true;
                        sel.appendChild(o);
                    });
                } catch { /* ignore */ }
            }
        })();

        async function profilSpeichern() {
            const fb = document.getElementById('profilFeedback');
            const mich = await getMich();
            const body = {
                firstName: document.getElementById('vorname').value.trim(),
                secondName: document.getElementById('nachname').value.trim()
            };
            if (!body.firstName || !body.secondName) {
                fb.textContent = 'Vor- und Nachname sind Pflicht.'; return;
            }
            // Abteilung nur mitschicken, wenn User.
            if (mich.role === 'User') {
                const abt = document.getElementById('abteilung').value;
                if (!abt) { fb.textContent = 'Bitte eine Abteilung wählen.'; return; }
                body.departmentName = abt;
            }
            try {
                await api('/api/account/me', { method: 'PUT', body: JSON.stringify(body) });
                fb.textContent = 'Profil gespeichert.';
                MICH = null; // Cache zurücksetzen, damit Name/Abteilung neu geladen werden
                await seitenleisteAufbauen('profil');
            } catch (e) { fb.textContent = e.message; }
        }

        async function passwortAendern() {
            const fb = document.getElementById('pwFeedback');
            const alt = document.getElementById('altPw').value;
            const neu = document.getElementById('neuPw').value;
            const neu2 = document.getElementById('neuPw2').value;
            if (!alt || !neu) { fb.textContent = 'Bitte alle Felder ausfüllen.'; return; }
            if (neu !== neu2) { fb.textContent = 'Neue Passwörter stimmen nicht überein.'; return; }
            try {
                await api('/api/account/me/password', {
                    method: 'PUT',
                    body: JSON.stringify({ oldPassword: alt, newPassword: neu })
                });
                fb.textContent = 'Passwort geändert.';
                document.getElementById('altPw').value = '';
                document.getElementById('neuPw').value = '';
                document.getElementById('neuPw2').value = '';
            } catch (e) { fb.textContent = e.message; }
        }
    </script>
</body>
</html>
