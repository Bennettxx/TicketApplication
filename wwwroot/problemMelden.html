<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Problem melden</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .karte { max-width: 640px; }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar"></div>

    <div class="main">
        <span class="benutzer" id="benutzername">...</span>
        <h1>Problem melden</h1>
        <p style="color:#555">Schnelles Kontaktformular an den Support. Erstellt ein neues Ticket.</p>

        <div class="karte">
            <label>Art des Problems</label>
            <select id="typInput">
                <option value="">Bitte wählen</option>
                <option value="Technisch">Technisches Problem</option>
                <option value="Frage">Frage / Allgemeine Anfrage</option>
                <option value="Sonstiges">Sonstiges</option>
            </select>

            <label>Abteilung</label>
            <select id="abteilungInput">
                <option value="">Bitte wählen</option>
            </select>

            <label>Priorität</label>
            <select id="prioritaetInput">
                <option value="0">Niedrig – kann warten</option>
                <option value="1">Mittel – bald lösen</option>
                <option value="2">Hoch – dringend</option>
            </select>

            <label>Beschreibung</label>
            <textarea id="beschreibungInput" rows="5"
                      placeholder="Beschreibe das Problem so genau wie möglich..."></textarea>

            <label style="font-weight:normal; margin-top:14px;">
                <input type="checkbox" id="agbInput" style="width:auto;">
                Ich stimme den AGB zu und bin mir bewusst, dass das Ticket Kosten verursachen kann.
            </label>

            <button class="btn-gruen" style="margin-top:16px;" onclick="senden()">An Support senden</button>
            <p id="feedback"></p>
        </div>
    </div>

    <script src="/app.js"></script>
    <script>
        (async function () {
            await seitenleisteAufbauen('problem');
            await abteilungenLaden();
        })();

        async function abteilungenLaden() {
            try {
                const abteilungen = await api('/api/metadata/departments');
                const sel = document.getElementById('abteilungInput');
                abteilungen.forEach(a => {
                    const o = document.createElement('option');
                    o.value = a.name; o.textContent = a.name;
                    sel.appendChild(o);
                });
            } catch (e) { /* ignore */ }
        }

        async function senden() {
            const feedback = document.getElementById('feedback');
            const typ = document.getElementById('typInput').value;
            const abteilung = document.getElementById('abteilungInput').value;
            const prioritaet = parseInt(document.getElementById('prioritaetInput').value);
            const beschreibung = document.getElementById('beschreibungInput').value.trim();
            const agb = document.getElementById('agbInput').checked;

            if (!typ || !abteilung || !beschreibung) {
                feedback.innerHTML = '<span class="feedback-rot">Bitte Art, Abteilung und Beschreibung ausfüllen!</span>';
                return;
            }
            if (!agb) {
                feedback.innerHTML = '<span class="feedback-rot">Bitte den AGB zustimmen.</span>';
                return;
            }

            try {
                await api('/api/ticket', {
                    method: 'POST',
                    body: JSON.stringify({
                        priority: prioritaet,
                        title: `[${typ}] ${beschreibung.substring(0, 60)}`,
                        description: beschreibung,
                        expectedResult: 'Problemfreie Nutzung.',
                        actualResult: beschreibung,
                        agreedBilling: true,
                        agreedAGB: true,
                        departmentName: abteilung,
                        subjectName: typ
                    })
                });
                feedback.innerHTML = '<span class="feedback-gruen">Deine Anfrage wurde an den Support gesendet!</span>';
                document.getElementById('typInput').value = '';
                document.getElementById('abteilungInput').value = '';
                document.getElementById('beschreibungInput').value = '';
                document.getElementById('agbInput').checked = false;
            } catch (e) {
                feedback.innerHTML = `<span class="feedback-rot">${esc(e.message)}</span>`;
            }
        }
    </script>
</body>
</html>
