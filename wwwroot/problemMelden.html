<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Problem melden</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        /* Standalone-Seite: funktioniert mit UND ohne Login, daher KEIN app.js. */
        body { display: block; }
        .wrap { max-width: 640px; margin: 40px auto; padding: 0 16px; }
        .kopf { display: flex; justify-content: space-between; align-items: center; }
        h1 { color: #2c3e50; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="kopf">
            <h1>Problem melden</h1>
            <a id="zurueck" href="/index.html" class="mini">Zum Login</a>
        </div>
        <p style="color:#555">Kurze Meldung an den Support. Ein Admin kümmert sich darum.</p>

        <div class="karte">
            <label>Titel</label>
            <input type="text" id="titel" maxlength="200" placeholder="Kurz und prägnant">

            <label>Beschreibung</label>
            <textarea id="beschreibung" rows="5" maxlength="2000" placeholder="Was ist das Problem?"></textarea>

            <label>Priorität</label>
            <select id="prio">
                <option value="0">Niedrig – kann warten</option>
                <option value="1">Mittel – bald lösen</option>
                <option value="2">Hoch – dringend</option>
            </select>

            <label>Kontakt-E-Mail (für Rückmeldung)</label>
            <input type="email" id="email" placeholder="name@firma.com">

            <button class="btn-gruen" style="margin-top:16px;" onclick="senden()">Absenden</button>
            <p id="feedback"></p>
        </div>
    </div>

    <script>
        const TOKEN = localStorage.getItem('meinToken');

        // Eingeloggt: E-Mail vorbefüllen (bleibt änderbar), Zurück-Link anpassen.
        (async function () {
            if (!TOKEN) return;
            document.getElementById('zurueck').href = '/startseite.html';
            document.getElementById('zurueck').textContent = '← Zurück';
            try {
                const res = await fetch('/api/user/me', { headers: { 'Authorization': `Bearer ${TOKEN}` } });
                if (res.ok) {
                    const mich = await res.json();
                    if (mich.email) document.getElementById('email').value = mich.email;
                }
            } catch { /* ignore */ }
        })();

        async function senden() {
            const fb = document.getElementById('feedback');
            const titel = document.getElementById('titel').value.trim();
            const beschreibung = document.getElementById('beschreibung').value.trim();
            const prio = parseInt(document.getElementById('prio').value);
            const email = document.getElementById('email').value.trim();

            if (titel.length < 3 || !beschreibung || !email) {
                fb.innerHTML = '<span class="feedback-rot">Titel (min. 3 Zeichen), Beschreibung und E-Mail sind Pflicht.</span>';
                return;
            }

            const headers = { 'Content-Type': 'application/json' };
            if (TOKEN) headers['Authorization'] = `Bearer ${TOKEN}`; // eingeloggt -> Ersteller wird erfasst

            try {
                const res = await fetch('/api/problem', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({ title: titel, description: beschreibung, priority: prio, contactEmail: email })
                });
                if (res.ok) {
                    fb.innerHTML = '<span class="feedback-gruen">Danke! Deine Problemmeldung ist eingegangen.</span>';
                    document.getElementById('titel').value = '';
                    document.getElementById('beschreibung').value = '';
                    document.getElementById('prio').value = '0';
                    if (!TOKEN) document.getElementById('email').value = '';
                } else {
                    let msg = 'Senden fehlgeschlagen.';
                    try {
                        const b = await res.json();
                        if (b.errors) msg = Object.values(b.errors).flat().join(' ');
                        else if (typeof b === 'string') msg = b;
                        else if (b.title) msg = b.title;
                    } catch { }
                    fb.innerHTML = `<span class="feedback-rot">${msg}</span>`;
                }
            } catch {
                fb.innerHTML = '<span class="feedback-rot">Server nicht erreichbar.</span>';
            }
        }
    </script>
</body>
</html>
