<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Benutzerverwaltung</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        h2 { color: #2c3e50; margin-top: 30px; }
        td select { width: auto; padding: 6px; }
        .akt-aus { color: #dc3545; font-weight: bold; }
        .akt-an { color: #28a745; font-weight: bold; }
        .akt-wartet { color: #e0a800; font-weight: bold; }
        .btn-mini { padding: 5px 10px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar"></div>

    <div class="main">
        <span class="benutzer" id="benutzername">...</span>
        <h1>Benutzerverwaltung</h1>
        <p id="feedback" class="mini"></p>

        <h2>Offene Registrierungen</h2>
        <p style="color:#555">Neue Konten, die noch freigeschaltet werden müssen.</p>
        <div id="pendingBereich" class="karte">Lädt...</div>

        <h2>Alle Benutzer</h2>
        <p style="color:#555">Rolle ändern oder Konto sperren/entsperren. Änderungen pro Zeile mit „Speichern" bestätigen.</p>

        <div class="karte" style="margin-bottom:16px;">
            <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
                <div style="flex:2; min-width:200px;">
                    <label style="margin-top:0;">Suche</label>
                    <input type="text" id="uSuche" placeholder="Name oder E-Mail..." oninput="userRender()">
                </div>
                <div style="flex:1; min-width:130px;">
                    <label style="margin-top:0;">Rolle</label>
                    <select id="uRolle" onchange="userRender()">
                        <option value="">Alle</option>
                        <option value="Admin">Admin</option>
                        <option value="Support">Support</option>
                        <option value="User">User</option>
                    </select>
                </div>
                <div style="flex:1; min-width:130px;">
                    <label style="margin-top:0;">Status</label>
                    <select id="uStatus" onchange="userRender()">
                        <option value="">Alle</option>
                        <option value="1">aktiv</option>
                        <option value="0">gesperrt</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="userBereich" class="karte">Lädt...</div>
    </div>

    <script src="/app.js"></script>
    <script>
        let MICH_CACHE = null;

        // seite aufbauen, nur admin
        (async function () {
            await seitenleisteAufbauen('benutzer');
            MICH_CACHE = await getMich();
            if (MICH_CACHE.role !== 'Admin') {
                document.querySelector('.main').innerHTML =
                    '<p class="feedback-rot">Kein Zugriff. Nur Admins.</p>';
                return;
            }
            await abteilungenLaden();
            await pendingLaden();
            await userLaden();
        })();

        // abteilungen für die auswahl je benutzer
        let ABTEILUNGEN = [];
        async function abteilungenLaden() {
            try { ABTEILUNGEN = await api('/api/metadata/departments'); }
            catch { ABTEILUNGEN = []; }
        }

        // options-html für das abteilungs-dropdown
        function abteilungOptions(selectedName) {
            const leer = `<option value="" ${!selectedName ? 'selected' : ''}>—</option>`;
            return leer + ABTEILUNGEN.map(a =>
                `<option value="${esc(a.name)}" ${a.name === selectedName ? 'selected' : ''}>${esc(a.name)}</option>`
            ).join('');
        }

        // feedback-zeile setzen
        function setFeedback(text, ok) {
            const fb = document.getElementById('feedback');
            fb.textContent = text;
            fb.className = ok ? 'feedback-gruen' : 'feedback-rot';
        }

        // offene registrierungen laden
        async function pendingLaden() {
            const bereich = document.getElementById('pendingBereich');
            try {
                const pending = await api('/api/user/pending');
                if (!pending.length) {
                    bereich.innerHTML = '<p>Keine offenen Registrierungen.</p>';
                    return;
                }
                bereich.innerHTML = `
                    <table>
                        <thead><tr><th>Name</th><th>E-Mail</th><th>Abteilung</th><th>Aktion</th></tr></thead>
                        <tbody>${pending.map(u => `
                            <tr>
                                <td>${esc(u.firstName)} ${esc(u.secondName)}</td>
                                <td>${esc(u.email)}
                                    ${u.emailConfirmed ? '' : '<br><span class="mini" style="color:#e0a800">E-Mail noch nicht bestätigt</span>'}</td>
                                <td>${esc(u.departmentName || '—')}</td>
                                <td>
                                    <button class="btn-gruen btn-mini" onclick="freischalten(${u.id})">Freischalten</button>
                                    <button class="btn-rot btn-mini" onclick="ablehnen(${u.id})">Ablehnen</button>
                                </td>
                            </tr>`).join('')}
                        </tbody>
                    </table>`;
            } catch (e) {
                bereich.innerHTML = `<p class="feedback-rot">${esc(e.message)}</p>`;
            }
        }

        // registrierung freischalten
        async function freischalten(id) {
            try {
                await api(`/api/user/${id}/approve`, { method: 'POST' });
                setFeedback('Benutzer freigeschaltet.', true);
                await pendingLaden(); await userLaden();
            } catch (e) { setFeedback(e.message, false); }
        }

        // registrierung ablehnen (soft-delete)
        async function ablehnen(id) {
            if (!confirm('Diese Registrierung wirklich ablehnen?')) return;
            try {
                await api(`/api/user/${id}`, { method: 'DELETE' });
                setFeedback('Registrierung abgelehnt.', true);
                await pendingLaden(); await userLaden();
            } catch (e) { setFeedback(e.message, false); }
        }

        // alle user laden
        let ALLE_USER = [];
        async function userLaden() {
            try {
                ALLE_USER = await api('/api/user');
                userRender();
            } catch (e) {
                document.getElementById('userBereich').innerHTML = `<p class="feedback-rot">${esc(e.message)}</p>`;
            }
        }

        // status-badge je user: gesperrt / wartet auf freischaltung / aktiv
        function statusBadge(u) {
            if (!u.isActive) return '<span class="akt-aus">gesperrt</span>';
            if (!u.isActivated) return '<span class="akt-wartet">nicht freigeschaltet</span>';
            return '<span class="akt-an">aktiv</span>';
        }

        // tabelle nach filtern neu zeichnen
        function userRender() {
            const bereich = document.getElementById('userBereich');
            const q = document.getElementById('uSuche').value.trim().toLowerCase();
            const rolle = document.getElementById('uRolle').value;
            const status = document.getElementById('uStatus').value;
            const mich = MICH_CACHE;

            const users = ALLE_USER.filter(u => {
                const name = `${u.firstName} ${u.secondName} ${u.email}`.toLowerCase();
                if (q && !name.includes(q)) return false;
                if (rolle && u.role !== rolle) return false;
                if (status === '1' && !u.isActive) return false;
                if (status === '0' && u.isActive) return false;
                return true;
            });

            if (!users.length) { bereich.innerHTML = '<p>Keine Benutzer gefunden.</p>'; return; }

            bereich.innerHTML = `
                    <table>
                        <thead><tr>
                            <th>Name</th><th>E-Mail</th><th>Rolle</th><th>Abteilung</th><th>Status</th><th>Aktion</th>
                        </tr></thead>
                        <tbody>${users.map(u => `
                            <tr>
                                <td>${esc(u.firstName)} ${esc(u.secondName)}</td>
                                <td>${esc(u.email)}</td>
                                <td>
                                    <select id="rolle-${u.id}" ${u.id === mich.id ? 'disabled' : ''}>
                                        <option value="0" ${u.role === 'Admin' ? 'selected' : ''}>Admin</option>
                                        <option value="1" ${u.role === 'Support' ? 'selected' : ''}>Support</option>
                                        <option value="2" ${u.role === 'User' ? 'selected' : ''}>User</option>
                                    </select>
                                </td>
                                <td>
                                    <select id="abt-${u.id}">${abteilungOptions(u.departmentName)}</select>
                                </td>
                                <td>${statusBadge(u)}</td>
                                <td>
                                    <button class="btn-grau btn-mini" onclick="userSpeichern(${u.id})">Speichern</button>
                                    ${u.id === mich.id ? '' :
                                        (u.isActive
                                            ? `<button class="btn-rot btn-mini" onclick="sperren(${u.id})">Sperren</button>`
                                            : `<button class="btn-gruen btn-mini" onclick="entsperren(${u.id})">Entsperren</button>`)}
                                </td>
                            </tr>`).join('')}
                        </tbody>
                    </table>`;
        }

        // rolle/abteilung einer zeile speichern
        async function userSpeichern(id) {
            const rolle = parseInt(document.getElementById(`rolle-${id}`).value);
            const abteilung = document.getElementById(`abt-${id}`).value;
            try {
                await api(`/api/user/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify({ role: rolle, departmentName: abteilung || null })
                });
                setFeedback('Änderung gespeichert.', true);
                await userLaden();
            } catch (e) { setFeedback(e.message, false); }
        }

        // konto sperren (soft-delete), login wird blockiert
        async function sperren(id) {
            try {
                await api(`/api/user/${id}`, { method: 'PUT', body: JSON.stringify({ isActive: false }) });
                setFeedback('Benutzer gesperrt.', true);
                await userLaden();
            } catch (e) { setFeedback(e.message, false); }
        }

        // konto entsperren
        async function entsperren(id) {
            try {
                await api(`/api/user/${id}`, { method: 'PUT', body: JSON.stringify({ isActive: true }) });
                setFeedback('Benutzer entsperrt.', true);
                await userLaden();
            } catch (e) { setFeedback(e.message, false); }
        }
    </script>
</body>
</html>
